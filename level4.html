<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="level4.css">
    <title>Level Quest</title>
</head>
<body>
    <div class="container py-5" style="margin-top: 200px">
        <div class="row justify-content-center">
            <div class="card col-lg-6 col-md-8 col-12">
                <div class="card-body">
                    <span id="LevelBadge" class="lvl badge badge-danger mb-4">Level 4</span>
                    <h2 class="card-title" style="text-align: center">Form Validation</h2>
                    <p id="CardText" class="card-text mb-4 text-muted" style="text-align: center;">Enter a name. Empty = error, filled = success.</p>
                    <label for="Nickname" class="formlbl">Hero Name</label>
                    <input name="Nickname" type="text" id="input" class="formControl w-100 p-2" placeholder="Type name here..."  >
                    <button class="btn btn-primary mt-2 w-100" id="submitbtn">Submit Name</button>
                    <p id="result" class="result"></p>
                    <hr>
                    <div class="buttons d-flex gap-3">
                        <a href="level3.html" class="btn btn-secondary w-50">Back</a>
                        <a href="level5.html" class="btn btn-success w-50">Next Level</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
      <script src="level4.js"></script>
</body>
</html>
